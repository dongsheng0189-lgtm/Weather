<!DOCTYPE html>
<html>
<head><title>查捕逃犯網路公告查詢</title></head>
<body>

<a class="focusable position-absolute top-0 start-0 border-0 overflow-hidden p-0" href="#AC" title="跳到主要內容">跳到主要內容區</a>
<header>
<div class="key-mark position-relative">
<a accesskey="U" class="position-absolute top-0 start-0 text-white fs-6 text-decoration-none" href="#AU" id="AU" title="頁面頂端功能區塊[快捷鍵Alt+U]">:::</a>
</div>
<nav class="navbar bg-success">
<div class="container">
<h1 class="text-warning h3 my-lg-0 text-center my-2">查捕逃犯網路公告查詢</h1>
</div>
</nav>
</header>

<main class="py-5">
<form id="form1" method="POST" onsubmit="return false;">
<div id="AC"></div>
<section class="py-5" id="tabMain">
<article class="py-5">

<div class="container" id="QueryPanl">
<div class="row">
<div class="col-xl-10 mx-auto">
<div class="position-relative">
<div class="card mb-5 icon-left search-result">
<div class="card-header bg-transparent border-0">
<h2 class="h5 mb-0 border-bottom pt-3 pb-1 icon-mark search-result">查詢結果</h2>
</div>
<div class="card-body p-4">

<div class="d-flex align-items-center justify-content-start">
<div class="d-flex align-items-center me-3 flex-lg-nowrap flex-wrap">
<h3 class="small text-green-29 mb-0 fw-normal"><i class="bi bi-people-fill me-1"></i>查詢人數：</h3>
<span class="small number-of-people" id="E8_COUNT">33728120</span>
</div>
</div>

<div class="p-md-4 mt-md-0 mt-3 d-flex align-items-end flex-nowrap">
<dl class="w-100">

<div class="d-flex align-items-stretch mb-2 flex-md-row flex-column border-bottom border-success">
<dt class="col-md-3 bg-gray-f7 text-green-19 fw-normal p-2 text-center">
<span class="text-nowrap" for="E8_NAME0">姓名</span>
</dt>
<dd class="p-2 mb-0 flex-fill d-flex align-items-center">
<span id="E8_NAME0" name="E8_NAME0">林肯帝</span>
</dd>
</div>

<div class="d-flex align-items-stretch mb-2 flex-md-row flex-column border-bottom border-success">
<dt class="col-md-3 bg-gray-f7 text-green-19 fw-normal p-2 text-center">
<span class="text-nowrap" for="E8_IDN0">身分證號/其他證號</span>
</dt>
<dd class="p-2 mb-0 flex-fill d-flex align-items-center">
<span id="E8_IDN0" name="'E8_IDN' + ${iter.index}"></span>
</dd>
</div>

<div class="d-flex align-items-stretch mb-2 flex-md-row flex-column border-bottom border-success">
<dt class="col-md-3 bg-gray-f7 text-green-19 fw-normal p-2 text-center">
<span class="text-nowrap" for="E8_WT_UNIT_NM0">通緝機關</span>
</dt>
<dd class="p-2 mb-0 flex-fill align-items-center" id="E8_WT_UNIT_NM0">
<ul class="row flex-wrap list-group">
<li class="col-md-3 col-6">基隆地檢</li>
</ul>
</dd>
</div>

</dl>
</div>

<div class="p-md-4 mt-md-0 mt-3 d-flex align-items-end flex-nowrap">
<dl class="w-100">
<div class="d-flex align-items-stretch mb-2 flex-md-row flex-column border-bottom border-success">
<dt class="col-md-3 bg-gray-f7 text-green-19 fw-normal p-2 text-center">
<span class="text-nowrap" for="E8_NOTE" style="color:red;">查詢結果注意事項</span>
</dt>
<dd class="p-2 mb-0 flex-fill align-items-center" id="E8_NOTE">
<ul class="row flex-wrap list-group" style="list-style:decimal;">
<li class="col-md-12 col-12">依據刑事訴訟法第85條規定，通緝書之發布及撤銷係屬司法院及法務部權責。</li>
<li class="col-md-12 col-12">本查詢結果有同名同姓、更名或異體字之虞。</li>
<li class="col-md-12 col-12">本資料來源係由原發布通緝機關提供，查詢結果僅供參考，勿移作他用。</li>
</ul>
</dd>
</div>
</dl>
</div>

<div class="py-4 d-md-block px-sm-5 px-4 mt-3 border-top text-center">
<button class="btn btn-outline-warning px-4 text-warning rounded-pill fs-5" id="backBtn" name="backBtn" type="button">回上一頁</button>
</div>

</div>
</div>
</div>
</div>
</div>

</article>
</section>
</form>
</main>

<footer><div class="bg-gray-f5 py-4"><div class="container"><p>內政部警政署版權所有</p></div></div></footer>

</body>
</html>
