{% extends "base.html" %}
{% block extra_head %}
<script src="{{ url_for('static', filename='js/edit_keepalive.js') }}?v=4"></script>
{% endblock %}
{% block content %}
<div style="max-width:680px; margin:1rem auto; padding:0 .75rem;">
  <h1>🛡️ 人員查詢</h1>
  <p style="color:#666; font-size:.9rem;">同時查詢司法院刑事判決、調查局通緝/嫌疑人、警政署外逃通緝犯。</p>

  <!-- Step 1: 姓名 + 身分證 + 選填欄位 -->
  <div id="step-name" style="margin-top:1rem;">
    <form id="vet-name-form">
      <label style="display:block; margin-bottom:.4rem;">姓名</label>
      <input type="text" id="vet-name" required
             style="width:100%; padding:.55rem; border:1px solid #ddd; border-radius:6px; font-size:1rem; margin-bottom:.75rem;">

      <label style="display:block; margin-bottom:.4rem;">身分證 / 居留證 <span style="color:#888;font-weight:400;font-size:.85rem;">（選填）</span></label>
      <input type="text" id="vet-id" maxlength="12"
             style="width:100%; padding:.55rem; border:1px solid #ddd; border-radius:6px; font-size:1rem; margin-bottom:.75rem; text-transform:uppercase;">

      <div style="color:#888; font-size:.85rem; margin-bottom:.4rem;">— 以下選填，填越多搜尋越準 —</div>

      <label style="display:block; margin-bottom:.4rem;">📞 電話 <span style="color:#888;font-weight:400;font-size:.85rem;">（多種格式都接受）</span></label>
      <input type="tel" id="vet-phone"
             placeholder="例：0912-345-678 / +886912345678"
             style="width:100%; padding:.55rem; border:1px solid #ddd; border-radius:6px; font-size:1rem; margin-bottom:.75rem;">

      <label style="display:block; margin-bottom:.4rem;">👥 關係人 <span style="color:#888;font-weight:400;font-size:.85rem;">（最多 2 人，純姓名）</span></label>
      <div id="vet-relatives">
        <input type="text" class="vet-rel-input" placeholder="關係人 1"
               style="width:100%; padding:.55rem; border:1px solid #ddd; border-radius:6px; font-size:1rem; margin-bottom:.4rem;">
      </div>
      <button type="button" id="vet-add-rel"
              style="background:none; border:1px dashed #888; padding:.4rem .8rem; border-radius:6px; cursor:pointer; font-size:.88rem; margin-bottom:.75rem;">
        + 新增關係人
      </button>

      <label style="display:block; margin-bottom:.4rem;">🏷 其他特徵 <span style="color:#888;font-weight:400;font-size:.85rem;">（縣市、公司、學校等）</span></label>
      <input type="text" id="vet-feature"
             placeholder="例：新北市 ABC餐廳"
             style="width:100%; padding:.55rem; border:1px solid #ddd; border-radius:6px; font-size:1rem; margin-bottom:.75rem;">

      <button type="submit" class="btn btn-primary" style="width:100%; padding:.6rem;">開始查詢</button>
    </form>
  </div>

  <!-- Step 2: NPA captcha -->
  <div id="step-captcha" style="display:none; margin-top:1rem;">
    <p>司法院 + 調查局已查詢，最後一步：請輸入下方驗證碼（警政署系統需要）。</p>
    <img id="vet-captcha-img" src="" alt="captcha"
         style="border:1px solid #ddd; cursor:pointer;" onclick="reloadCaptcha()">
    <div style="font-size:.78rem; color:#888;">點圖換一張</div>
    <form id="vet-captcha-form" style="margin-top:.6rem;">
      <input type="text" id="vet-captcha-text" required maxlength="10" autofocus
             style="width:100%; padding:.55rem; border:1px solid #ddd; border-radius:6px; font-size:1rem; margin-bottom:.5rem;">
      <button type="submit" class="btn btn-primary" style="width:100%; padding:.6rem;">送出 / 顯示結果</button>
    </form>
  </div>

  <!-- Step 3: result -->
  <div id="step-result" style="display:none; margin-top:1rem;"></div>

  <div id="vet-status" style="margin-top:1rem; color:#666; font-size:.85rem;"></div>
</div>

{% if has_feature('vetting') %}
  {% include 'icinfo/_form.html' %}
{% endif %}

<script>
var _qid = null;
var _name = null;
var _id = null;

function show(id) {
  ['step-name','step-captcha','step-result'].forEach(function(s){
    document.getElementById(s).style.display = (s === id) ? 'block' : 'none';
  });
}
function setStatus(msg) { document.getElementById('vet-status').textContent = msg || ''; }

var _vetTickTimer = null;
var _vetTickStart = 0;
function startTick(baseMsg) {
  stopTick();
  _vetTickStart = Date.now();
  setStatus(baseMsg + '（已等待 0 秒）');
  _vetTickTimer = setInterval(function() {
    var secs = Math.floor((Date.now() - _vetTickStart) / 1000);
    setStatus(baseMsg + '（已等待 ' + secs + ' 秒）');
  }, 1000);
}
function stopTick() {
  if (_vetTickTimer) { clearInterval(_vetTickTimer); _vetTickTimer = null; }
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

// 安全解析回應：非 JSON（HTML 錯誤頁 / 429 限流 / 逾時）回 [status, null]，
// 不再讓 r.json() 噴「unexpected token <」。
function vetParse(r) {
  return r.text().then(function(t) {
    var d = null; try { d = JSON.parse(t); } catch (e) {}
    return [r.status, d];
  });
}
function vetErrMsg(st, d) {
  if (d && d.message) return d.message;
  if (st === 429) return '操作太頻繁，請稍候幾秒再試';
  return '伺服器忙碌或逾時，請稍後重新查詢';
}
var VET_JSON_HEADERS = {'Content-Type': 'application/json', 'Accept': 'application/json'};

// 關係人「+ 新增關係人」progressive UI (max 2 rows, then lock the button)
document.getElementById('vet-add-rel').addEventListener('click', function() {
  var container = document.getElementById('vet-relatives');
  if (container.querySelectorAll('.vet-rel-input').length >= 2) return;
  var input = document.createElement('input');
  input.type = 'text';
  input.className = 'vet-rel-input';
  input.placeholder = '關係人 2';
  input.style.cssText = 'width:100%; padding:.55rem; border:1px solid #ddd; border-radius:6px; font-size:1rem; margin-bottom:.4rem;';
  container.appendChild(input);
  // Lock the button after reaching 2
  if (container.querySelectorAll('.vet-rel-input').length >= 2) {
    document.getElementById('vet-add-rel').style.display = 'none';
  }
});

document.getElementById('vet-name-form').addEventListener('submit', function(e) {
  e.preventDefault();
  _name = document.getElementById('vet-name').value.trim();
  _id = document.getElementById('vet-id').value.trim().toUpperCase();
  if (!_name) return;

  // Collect new social fields (max 2 relatives, filter empties)
  var _relatives = Array.from(document.querySelectorAll('.vet-rel-input'))
    .map(function(i) { return i.value.trim(); })
    .filter(function(v) { return v !== ''; })
    .slice(0, 2);
  var _phone = document.getElementById('vet-phone').value.trim();
  var _feature = document.getElementById('vet-feature').value.trim();
  // Stash for reloadCaptcha re-use (same fields on second /start call)
  window._socialPayload = {phone: _phone, relatives: _relatives, feature: _feature};

  startTick('🔍 查詢中：警政署取驗證碼 → 司法院刑事判決 → 法務部通緝');
  fetch('/vetting/start', {
    method: 'POST', headers: VET_JSON_HEADERS,
    body: JSON.stringify({
      name: _name, id: _id,
      phone: _phone, relatives: _relatives, feature: _feature
    })
  }).then(vetParse).then(function(arr){
    stopTick();
    var st = arr[0], d = arr[1];
    if (st !== 200 || !d) {
      setStatus('錯誤：' + vetErrMsg(st, d));
      return;
    }
    _qid = d.query_id;
    document.getElementById('vet-captcha-img').src = 'data:image/jpeg;base64,' + d.captcha_b64;
    show('step-captcha');
    setStatus('✓ 司法院 + 法務部已查完，請輸入警政署驗證碼');
    document.getElementById('vet-captcha-text').value = '';
    document.getElementById('vet-captcha-text').focus();
  }).catch(function(err){ stopTick(); setStatus('連線失敗：' + err.message); });
});

function reloadCaptcha(reason) {
  var isErr = (reason === 'captcha_error');
  var sp = window._socialPayload || {phone: '', relatives: [], feature: ''};
  startTick(isErr ? '❌ 驗證碼錯誤，正在換一張新的'
                  : '🔄 重整驗證碼中（會重跑三家查詢）');
  fetch('/vetting/start', {
    method: 'POST', headers: VET_JSON_HEADERS,
    body: JSON.stringify({
      name: _name, id: _id,
      phone: sp.phone, relatives: sp.relatives, feature: sp.feature
    })
  }).then(vetParse).then(function(arr){
    stopTick();
    var st = arr[0], d = arr[1];
    if (st === 200 && d && d.query_id) {
      _qid = d.query_id;
      document.getElementById('vet-captcha-img').src = 'data:image/jpeg;base64,' + d.captcha_b64;
      setStatus(isErr ? '❌ 驗證碼錯誤，已換一張新的，請重新輸入'
                      : '✓ 驗證碼已更新');
    } else {
      setStatus('換驗證碼失敗：' + vetErrMsg(st, d));
    }
  }).catch(function(err){ stopTick(); setStatus('換驗證碼失敗：' + err.message); });
}

document.getElementById('vet-captcha-form').addEventListener('submit', function(e) {
  e.preventDefault();
  var captcha = document.getElementById('vet-captcha-text').value.trim();
  if (!captcha || !_qid) return;
  startTick('🔍 警政署送出驗證碼 + 解析結果中');
  fetch('/vetting/submit', {
    method: 'POST', headers: VET_JSON_HEADERS,
    body: JSON.stringify({query_id: _qid, captcha: captcha})
  }).then(vetParse).then(function(arr){
    stopTick();
    var st = arr[0], d = arr[1];
    if (!d) { setStatus('連線失敗：' + vetErrMsg(st, d)); return; }
    if (st !== 200) {
      if (d.error === 'captcha_invalid') {
        document.getElementById('vet-captcha-text').value = '';
        reloadCaptcha('captcha_error');
        return;
      }
      if (d.error === 'query_expired') {
        setStatus('查詢逾時，請重新開始');
        show('step-name');
        return;
      }
      setStatus('錯誤：' + (d.message || d.error || '未知'));
      return;
    }
    renderResult(d);
    show('step-result');
    setStatus('✓ 查詢完成');
  }).catch(function(err){ stopTick(); setStatus('連線失敗：' + err.message); });
});

function renderResult(d) {
  var html = '';

  // ── A. 司法院 ──
  html += '<h2 style="margin-top:0;">A. 司法院刑事判決</h2>';
  if (d.judicial === null) {
    html += '<p style="color:#c0392b;">⚠ 司法院系統暫時無法連線。</p>';
  } else if (!d.judicial || d.judicial.length === 0) {
    html += '<p style="color:#888;">查無資料。</p>';
  } else {
    html += '<p style="color:#666; font-size:.9rem;">共 ' + d.judicial.length + ' 筆，⚠ 為命中關鍵字</p>';
    d.judicial.forEach(function(r) {
      var hit = (r.keyword_hits || []).length > 0;
      html += '<div style="border:1px solid #e0e0e0; border-radius:6px; padding:.6rem; margin-bottom:.5rem; '
            + (hit ? 'border-left:4px solid #e74c3c; background:#fff5f5;' : '') + '">';
      html += '<div style="font-weight:600;">' + (hit ? '⚠ ' : '') + escapeHtml(r.subject) + '</div>';
      html += '<div style="color:#666; font-size:.88rem;">'
            + escapeHtml(r.case_no) + '　日期：' + escapeHtml(r.date) + '</div>';
      if (hit) {
        html += '<div style="color:#c0392b; font-size:.88rem; margin-top:.2rem;">命中關鍵字：'
              + r.keyword_hits.map(escapeHtml).join(' / ') + '</div>';
      }
      if (r.masked_names && r.masked_names.length > 0) {
        html += '<div style="font-size:.85rem; color:#666; margin-top:.2rem;">遮蔽人名：'
              + r.masked_names.map(escapeHtml).join('、') + '</div>';
      }
      if (r.masked_ids && r.masked_ids.length > 0) {
        var idIcon = (r.id_match === true) ? '🎯 ' : '';
        html += '<div style="font-size:.85rem; color:' + (r.id_match === true ? '#16a085' : '#666')
              + '; margin-top:.2rem;">' + idIcon + '遮蔽身分證：'
              + r.masked_ids.map(escapeHtml).join('、')
              + (r.id_match === true ? '（部分相符）' : '') + '</div>';
      } else if (r.id_match === null && _id) {
        html += '<div style="font-size:.8rem; color:#aaa; margin-top:.2rem;">（此判決未顯示身分證，無法 ID 比對）</div>';
      }
      html += '<div style="margin-top:.3rem;"><a href="' + escapeHtml(r.detail_url)
            + '" target="_blank" rel="noopener" style="font-size:.85rem;">→ 開原判決書</a></div>';
      html += '</div>';
    });
  }

  // ── B. MJIB ──
  html += '<h2 style="margin-top:1rem;">B. 法務部調查局通緝/嫌疑人</h2>';
  if (d.mjib === null) {
    html += '<p style="color:#c0392b;">⚠ 調查局系統暫時無法連線。</p>';
  } else if (!d.mjib || d.mjib.length === 0) {
    html += '<p style="color:#888;">✅ 查無資料。</p>';
  } else {
    html += '<p style="color:#c0392b;">⚠ 命中 ' + d.mjib.length + ' 筆</p>';
    d.mjib.forEach(function(e) {
      html += '<div style="border:1px solid #e0e0e0; border-radius:6px; padding:.6rem; margin-bottom:.5rem;">';
      html += '<div style="font-weight:600;">' + escapeHtml(e.name)
            + (e.eng_name ? ' <span style="font-weight:400; color:#888;">(' + escapeHtml(e.eng_name) + ')</span>' : '')
            + '</div>';
      if (e.masked_id) {
        html += '<div style="font-family:monospace; margin-top:.2rem;">遮蔽身分證：'
              + escapeHtml(e.masked_id) + ' ← 自行比對</div>';
      }
      if (e.birth) html += '<div style="color:#666; font-size:.85rem;">出生年：' + escapeHtml(e.birth) + '</div>';
      if (e.photo_url) html += '<img src="' + escapeHtml(e.photo_url) + '" alt="" style="max-width:100px; margin-top:.3rem;">';
      if (e.detail_url) html += '<div><a href="' + escapeHtml(e.detail_url) + '" target="_blank" rel="noopener">→ 詳情</a></div>';
      html += '</div>';
    });
  }

  // ── C. NPA ──
  html += '<h2 style="margin-top:1rem;">C. 警政署外逃通緝犯</h2>';
  if (d.npa === null) {
    html += '<p style="color:#c0392b;">⚠ 警政署系統暫時無法連線。</p>';
  } else if (!d.npa || d.npa.length === 0) {
    html += '<p style="color:#888;">✅ 查無資料。</p>';
  } else {
    html += '<p style="color:#c0392b;">⚠ 命中 ' + d.npa.length + ' 筆</p>';
    d.npa.forEach(function(e) {
      html += '<div style="border:1px solid #e0e0e0; border-radius:6px; padding:.6rem; margin-bottom:.5rem;">';
      html += '<div style="font-weight:600;">' + escapeHtml(e.name) + '</div>';
      if (e.id_no) html += '<div style="font-size:.9rem;">身分證號：' + escapeHtml(e.id_no) + '</div>';
      if (e.wt_unit) html += '<div style="font-size:.9rem;">通緝機關：' + escapeHtml(e.wt_unit) + '</div>';
      if (e.detail_url) html += '<div><a href="' + escapeHtml(e.detail_url) + '" target="_blank" rel="noopener">→ 詳情</a></div>';
      html += '</div>';
    });
  }

  // ── Social warning banner + D/E/F ──
  if (d.social && d.social.people && d.social.people.length > 0) {

    // Banner: incognito-mode guide
    html += '<details open style="margin-top:1.5rem; border:1px solid #fcd34d; background:#fef3c7; border-radius:6px; padding:.5rem .75rem;">';
    html += '<summary style="cursor:pointer; font-weight:600;">ℹ️ 點連結前請先看 — 如何用無痕模式開啟</summary>';
    html += '<div style="margin-top:.5rem; font-size:.88rem; line-height:1.6; color:#444;">';
    html += '直接點連結會在當前瀏覽器開啟、登入的 FB / Google 帳號會記錄你查詢過誰。<br>強烈建議用「無痕視窗」開：<br>';
    html += '• 桌機 Chrome / Edge：右鍵連結 → 「在無痕視窗中開啟連結」<br>';
    html += '• 桌機 Safari（Mac）：右鍵連結 → 「在新的私密視窗中開啟連結」<br>';
    html += '• 桌機 Firefox：右鍵連結 → 「在隱私視窗中開啟連結」<br>';
    html += '• 手機 Chrome（Android）：長按連結 → 「在無痕分頁中開啟」<br>';
    html += '• 手機 Safari（iPhone / iPad）：長按連結 → 「在私密瀏覽中開啟」<br>';
    html += '</div></details>';

    // ── D. 電話標記 ──
    if (d.social.phone) {
      var p = d.social.phone;
      html += '<h2 style="margin-top:1rem;">D. 📞 電話標記</h2>';
      html += '<div style="border:1px solid #e0e0e0; border-radius:6px; padding:.6rem; background:#f9fafb;">';
      html += '<div style="font-family:monospace; font-size:1.05rem; margin-bottom:.4rem;">' + escapeHtml(p.normalized) + '</div>';
      html += '<a href="' + escapeHtml(p.whoscall_url) + '" target="_blank" rel="noopener" class="btn btn-secondary" style="margin-right:.4rem; margin-bottom:.3rem; display:inline-block; padding:.4rem .7rem;">→ Whoscall</a>';
      html += '<a href="' + escapeHtml(p.truecaller_url) + '" target="_blank" rel="noopener" class="btn btn-secondary" style="margin-right:.4rem; margin-bottom:.3rem; display:inline-block; padding:.4rem .7rem;">→ TrueCaller</a>';
      html += '<a href="' + escapeHtml(p.google_phone_url) + '" target="_blank" rel="noopener" class="btn btn-secondary" style="display:inline-block; padding:.4rem .7rem;">→ Google 電話搜尋</a>';
      html += '</div>';
    }

    // ── E + F: per-person blocks (Google + FB/IG link-out, Option C collapsible) ──
    html += '<h2 style="margin-top:1rem;">E + F. 🌐 社群 / Google 搜尋連結</h2>';
    d.social.people.forEach(function(person, idx) {
      var isEmployee = (person.role === 'employee');
      var openAttr = isEmployee ? ' open' : '';
      var icon = isEmployee ? '👤' : '👥';
      var label = isEmployee ? '員工本人' : ('關係人 ' + idx);
      html += '<details' + openAttr + ' class="vet-person-block" style="border:1px solid #e0e0e0; border-radius:6px; padding:.5rem .75rem; margin-bottom:.5rem;">';
      html += '<summary style="cursor:pointer; font-weight:600;">' + icon + ' ' + escapeHtml(person.name) + '（' + label + '）</summary>';
      html += '<div style="margin-top:.5rem;">';

      // Google 4 link 直接列出（不收進 sub-menu）
      html += '<div style="margin-bottom:.4rem; display:flex; flex-direction:column; gap:.3rem;">';
      html += '<div style="font-size:.85rem; color:#0e7490; font-weight:600;">🌐 Google 搜尋</div>';
      html += '<a href="' + escapeHtml(person.google_general_url) + '" target="_blank" rel="noopener" style="padding-left:.6rem;">→ 一般搜尋（含已填條件）</a>';
      html += '<a href="' + escapeHtml(person.google_company_url) + '" target="_blank" rel="noopener" style="padding-left:.6rem;">🏢 公司/採購相關</a>';
      html += '<a href="' + escapeHtml(person.google_award_url) + '" target="_blank" rel="noopener" style="padding-left:.6rem;">🏆 獎項/證照相關</a>';
      html += '<a href="' + escapeHtml(person.google_negative_url) + '" target="_blank" rel="noopener" style="padding-left:.6rem; color:#b91c1c;">🚨 警方/負面相關</a>';
      html += '</div>';

      // FB / IG buttons
      html += '<div style="display:flex; flex-wrap:wrap; gap:.4rem;">';
      html += '<a href="' + escapeHtml(person.fb_search_url) + '" target="_blank" rel="noopener" class="btn btn-secondary" style="padding:.4rem .7rem;">📱 FB 搜尋</a>';
      html += '<a href="' + escapeHtml(person.ig_search_url) + '" target="_blank" rel="noopener" class="btn btn-secondary" style="padding:.4rem .7rem;">📱 IG 搜尋</a>';
      if (person.conjunction_with_employee_url) {
        html += '<a href="' + escapeHtml(person.conjunction_with_employee_url) + '" target="_blank" rel="noopener" class="btn btn-secondary" style="padding:.4rem .7rem;">🔗 與員工共同搜尋</a>';
      }
      html += '</div>';
      html += '</div></details>';
    });
  }

  html += '<div style="margin-top:1rem;"><a href="/vetting/" class="btn btn-secondary">↻ 重新查詢</a></div>';

  document.getElementById('step-result').innerHTML = html;
}

// 查詢頁刷新 session、配合 app._enforce_session_idle 的 vetting 15 分鐘 grace。
// 使用者讀判例 / 等 captcha 圖 / 思考時都可能 > 5 分鐘但 < 15 分鐘。
EditKeepalive.init();
</script>
{% endblock %}
