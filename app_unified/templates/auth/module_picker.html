{% extends "base.html" %}
{% block title %}選擇模組{% endblock %}
{% block content %}
<style>
  .picker-wrap { max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
  .picker-title { text-align: center; font-size: 1.3rem; color: #2c3e50; margin-bottom: 1.5rem; }
  .picker-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; }
  .picker-card { display: flex; flex-direction: column; align-items: center; justify-content: center;
                 background: #fff; border: 1px solid #e0e0e0; border-radius: 14px;
                 padding: 1.75rem 1rem; min-height: 150px; text-decoration: none; color: #2c3e50;
                 transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
                 box-shadow: 0 2px 8px rgba(0,0,0,.04); }
  .picker-card:hover, .picker-card:active { transform: translateY(-2px); border-color: #3498db;
                                             box-shadow: 0 6px 18px rgba(52,152,219,.15); }
  .picker-card .emoji { font-size: 3rem; line-height: 1; margin-bottom: .75rem; }
  .picker-card .label { font-size: 1rem; font-weight: 600; text-align: center; }
  .picker-card .status { margin-top: .35rem; font-size: .75rem; color: #999; }
  .picker-card.disabled { opacity: .6; cursor: not-allowed; }
  .font-toggle { margin: 2rem auto 0; text-align: center; }
  .font-toggle-label { font-size: .85rem; color: #666; margin-bottom: .5rem; }
  .font-toggle-group { display: inline-flex; border: 1px solid #ccc; border-radius: 8px; overflow: hidden; }
  .font-toggle-btn { background: #fff; border: none; padding: .6rem 1.2rem; cursor: pointer; font-size: 1rem; color: #333; min-height: 40px; }
  .font-toggle-btn + .font-toggle-btn { border-left: 1px solid #ccc; }
  .font-toggle-btn.active { background: #2c3e50; color: #fff; }
</style>
<div class="picker-wrap">
  <div class="picker-title">選擇要進入的模組</div>
  <div class="picker-grid">
    {% for f in features %}
    <a class="picker-card {% if not f.enabled %}disabled{% endif %}" href="{{ f.url }}">
      <div class="emoji">{{ f.emoji }}</div>
      <div class="label">{{ f.label }}</div>
      {% if not f.enabled %}<div class="status">開發中</div>{% endif %}
    </a>
    {% endfor %}
  </div>
  <div class="font-toggle">
    <div class="font-toggle-label">字體大小</div>
    <div class="font-toggle-group" role="group" aria-label="字體大小">
      <button type="button" class="font-toggle-btn" data-size="small" style="font-size:.9rem;">小</button>
      <button type="button" class="font-toggle-btn" data-size="medium" style="font-size:1.05rem;">中</button>
      <button type="button" class="font-toggle-btn" data-size="large" style="font-size:1.2rem;">大</button>
    </div>
  </div>
</div>
<script>
  (function() {
    var sizes = { small: '16px', medium: '19px', large: '22px' };
    var current = localStorage.getItem('font_size_pref') || 'small';
    function apply(pref) {
      document.documentElement.style.fontSize = sizes[pref] || sizes.small;
      localStorage.setItem('font_size_pref', pref);
      document.querySelectorAll('.font-toggle-btn').forEach(function(btn){
        btn.classList.toggle('active', btn.getAttribute('data-size') === pref);
      });
    }
    document.querySelectorAll('.font-toggle-btn').forEach(function(btn){
      btn.addEventListener('click', function(){ apply(btn.getAttribute('data-size')); });
    });
    apply(current);
  })();
</script>
{% endblock %}
