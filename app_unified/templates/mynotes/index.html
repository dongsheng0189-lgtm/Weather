{% extends "base.html" %}
{% block title %}私人筆記{% endblock %}
{% block extra_head %}
<script>window.IDLE_LIMIT_MS = 30 * 60 * 1000;</script>
<style>
.mn-wrap { max-width: 820px; margin: 1rem auto; padding: 0 .75rem; }
.mn-search { display: flex; gap: .5rem; align-items: center; background: #fff; border: 1px solid #e0e0e0;
             border-radius: 999px; padding: .5rem .9rem; box-shadow: 0 1px 4px rgba(0,0,0,.04); margin-bottom: 1rem; }
.mn-search input { border: none; outline: none; flex: 1; font-size: 1rem; padding: 0; background: transparent; }
.mn-search .icon { color: #999; font-size: 1.1rem; }
.mn-new-bar { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
.mn-new-btn { flex: 1; min-width: 110px; padding: .7rem .6rem; border-radius: 10px; border: none; cursor: pointer;
              font-size: .92rem; font-weight: 600; color: #fff; text-align: center; text-decoration: none; }
.mn-new-btn.meeting { background: #3498db; }
.mn-new-btn.todo-note { background: #27ae60; }
.mn-new-btn.todo-checklist { background: #e67e22; }
.mn-filter-bar { display: flex; gap: .35rem; flex-wrap: wrap; margin-bottom: .75rem; }
.mn-filter-chip { padding: .3rem .7rem; border-radius: 14px; border: 1px solid #ddd; background: #fff; cursor: pointer;
                  font-size: .82rem; color: #555; user-select: none; }
.mn-filter-chip.active { background: #2c3e50; border-color: #2c3e50; color: #fff; }
.mn-filter-chip[data-type="meeting"].active { background: #3498db; border-color: #3498db; }
.mn-filter-chip[data-type="todo_note"].active { background: #27ae60; border-color: #27ae60; }
.mn-filter-chip[data-type="todo_checklist"].active { background: #e67e22; border-color: #e67e22; }
.mn-reminders { background: #fff8e1; border: 1px solid #ffd54f; border-radius: 10px; padding: .85rem 1rem;
                margin-bottom: 1rem; }
.mn-reminders h4 { margin-bottom: .5rem; color: #e65100; font-size: 1rem; display:flex; align-items:center; gap:.35rem; }
.mn-reminders ul { list-style: none; padding: 0; margin: 0; }
.mn-reminders li { padding: .35rem 0; border-bottom: 1px dashed #ffe082; display:flex; align-items:center; gap:.5rem; }
.mn-reminders li:last-child { border-bottom: none; }
.mn-reminders a { color: #333; text-decoration: none; font-size: .9rem; flex: 1; }
.mn-reminders .chip { font-size: .7rem; padding: .1rem .45rem; border-radius: 8px; background: #fff; color: #e65100;
                      border: 1px solid #ffb74d; }
.mn-reminders .chip.overdue { background: #ef5350; color:#fff; border-color:#ef5350; }
.mn-card { background: #fff; border: 1px solid #eee; border-radius: 10px; padding: .85rem 1rem; margin-bottom: .6rem;
           text-decoration: none; color: #333; display: block; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
.mn-card:hover { border-color: #3498db; }
.mn-card-head { display: flex; align-items: center; gap: .5rem; margin-bottom: .2rem; font-weight: 600; }
.mn-card-type { font-size: .72rem; padding: .1rem .45rem; border-radius: 8px; color: #fff; }
.mn-card-type.meeting { background: #3498db; }
.mn-card-type.todo_note { background: #27ae60; }
.mn-card-type.todo_checklist { background: #e67e22; }
.mn-card-title { flex: 1; font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mn-card-meta { font-size: .78rem; color: #888; display: flex; gap: .75rem; flex-wrap: wrap; }
.mn-card-meta .reminder-due { color: #e65100; font-weight: 600; }
.mn-card-meta .reminder-overdue { color: #c62828; font-weight: 700; }
.mn-empty { text-align: center; color: #999; padding: 2rem 1rem; }
</style>
{% endblock %}
{% block content %}
<div class="mn-wrap">
  <div class="mn-search">
    <span class="icon">🔍</span>
    <input id="mn-search" type="text" placeholder="搜尋標題或內容..." autocomplete="off">
  </div>

  <div id="mn-reminders-box"></div>

  <div class="mn-new-bar">
    <a class="mn-new-btn meeting" href="{{ url_for('mynotes.new_note') }}?type=meeting">📅 會議紀錄</a>
    <a class="mn-new-btn todo-note" href="{{ url_for('mynotes.new_note') }}?type=todo_note">📝 代辦筆記</a>
    <a class="mn-new-btn todo-checklist" href="{{ url_for('mynotes.new_note') }}?type=todo_checklist">☑️ 代辦清單</a>
  </div>

  <div class="mn-filter-bar">
    <span class="mn-filter-chip active" data-type="" onclick="setFilter(this, '')">全部</span>
    <span class="mn-filter-chip" data-type="meeting" onclick="setFilter(this, 'meeting')">📅 會議</span>
    <span class="mn-filter-chip" data-type="todo_note" onclick="setFilter(this, 'todo_note')">📝 代辦</span>
    <span class="mn-filter-chip" data-type="todo_checklist" onclick="setFilter(this, 'todo_checklist')">☑️ 清單</span>
  </div>

  <div id="mn-list"></div>
</div>

<script>
var TYPE_META = {
  meeting: { emoji: '📅', label: '會議' },
  todo_note: { emoji: '📝', label: '代辦' },
  todo_checklist: { emoji: '☑️', label: '清單' },
};

function fmtDate(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d)) return iso;
  return (d.getMonth()+1) + '/' + d.getDate() + ' ' + ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
}

function fmtDateOnly(iso) {
  if (!iso) return '';
  // iso is YYYY-MM-DD
  return iso.replace(/^\d{4}-/, '');  // MM-DD
}

function loadReminders() {
  fetch('/mynotes/api/reminders/today').then(function(r){return r.json();}).then(function(list){
    var box = document.getElementById('mn-reminders-box');
    if (!list || list.length === 0) { box.innerHTML = ''; return; }
    var html = '<div class="mn-reminders"><h4>⏰ 今日提醒（' + list.length + '）</h4><ul>';
    list.forEach(function(r){
      var chip = r.overdue
        ? '<span class="chip overdue">逾期</span>'
        : '<span class="chip">今天</span>';
      var emoji = TYPE_META[r.note_type] ? TYPE_META[r.note_type].emoji + ' ' : '';
      var display;
      if (r.kind === 'item') {
        display = emoji + escapeHtml(r.title) + ' — ' + escapeHtml(r.text);
      } else {
        display = emoji + escapeHtml(r.title);
      }
      html += '<li>' + chip + '<a href="/mynotes/' + r.note_id + '">' + display + '</a></li>';
    });
    html += '</ul></div>';
    box.innerHTML = html;
  });
}

var _currentFilter = '';
function setFilter(el, type) {
  _currentFilter = type;
  document.querySelectorAll('.mn-filter-chip').forEach(function(c){ c.classList.remove('active'); });
  el.classList.add('active');
  loadList();
}

function loadList() {
  var q = document.getElementById('mn-search').value.trim();
  var url = '/mynotes/api' + (q ? ('?q=' + encodeURIComponent(q)) : '');
  fetch(url).then(function(r){return r.json();}).then(function(list){
    if (_currentFilter) list = list.filter(function(n){ return n.note_type === _currentFilter; });
    var box = document.getElementById('mn-list');
    if (!list || list.length === 0) {
      box.innerHTML = '<div class="mn-empty">' + (q ? '沒有符合的筆記' : '還沒有筆記，點上方按鈕新增') + '</div>';
      return;
    }
    var today = new Date().toISOString().slice(0,10);
    box.innerHTML = list.map(function(n){
      var meta = TYPE_META[n.note_type] || { label: n.note_type };
      var reminder = '';
      if (n.reminder_date) {
        var cls = n.reminder_date < today ? 'reminder-overdue'
                 : (n.reminder_date === today ? 'reminder-due' : '');
        reminder = '<span class="' + cls + '">⏰ ' + n.reminder_date + '</span>';
      }
      var progress = n.note_type === 'todo_checklist'
        ? '<span>' + n.done_count + '/' + n.item_count + '</span>'
        : '';
      return '<a class="mn-card" href="/mynotes/' + n.id + '">'
        + '<div class="mn-card-head">'
          + '<span class="mn-card-type ' + n.note_type + '">' + meta.label + '</span>'
          + '<span class="mn-card-title">' + escapeHtml(n.title) + '</span>'
        + '</div>'
        + '<div class="mn-card-meta">'
          + '<span>' + fmtDate(n.updated_at) + '</span>'
          + reminder + progress
        + '</div>'
      + '</a>';
    }).join('');
  });
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

var _searchTimer;
document.getElementById('mn-search').addEventListener('input', function(){
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(loadList, 250);
});

loadReminders();
loadList();
</script>
{% endblock %}
