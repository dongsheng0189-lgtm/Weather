name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app_unified

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: app_unified/requirements.txt

      # dlib + face_recognition_models come from prebuilt wheels (same as prod base),
      # so no cmake/compile is needed — only the runtime libs dlib links against.
      - name: Install system dependencies (for dlib wheel)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1 libopenblas0 liblapack3

      - name: Install Python dependencies
        run: |
          # Mirror Dockerfile.base ordering: prebuilt wheels --no-deps, then
          # face_recognition --no-deps (pure-python, dropped from the lock), then the
          # hashed lockfile via --require-hashes, then test tools in a SEPARATE command
          # (mixing unhashed pytest into the hashed install fails --require-hashes mode).
          pip install --no-deps \
            wheels/dlib-20.0.1-cp312-cp312-linux_x86_64.whl \
            wheels/face_recognition_models-0.3.0-py2.py3-none-any.whl
          pip install --no-deps face_recognition==1.3.0
          pip install --require-hashes -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key
          DATABASE_URL: "sqlite:///:memory:"
          FLASK_ENV: testing
        run: pytest tests/ -v --tb=short --cov=. --cov-report=term-missing

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app_unified/htmlcov/

  # monitor 是獨立 service（獨立 container、獨立依賴），所以獨立 job。
  # 它不需要 dlib / torch 那套重依賴，跑起來只要幾秒。
  monitor-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monitor

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: monitor/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v --tb=short
